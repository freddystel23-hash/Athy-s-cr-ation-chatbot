!DOCTYPE html>
<html lang="fr">
<head>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050816;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;

    }

    h1 {
      margin-bottom: 0.5rem;
    }

      margin-top: 0;
      opacity: 0.9;
    }

</html>
