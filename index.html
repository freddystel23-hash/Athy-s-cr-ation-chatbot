!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Athy’s Création – IA & Storytelling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Athy’s Création – GPT personnels, agent IA et storytelling premium pour entrepreneurs."
  />
  <style>
    /* Styles simplifiés - uniquement pour le bot */
    body { background: #020617; font-family: Arial, sans-serif; color: #e5e7eb; margin: 0; }
    .chatbot { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
    .chat-button { padding: 10px 15px; background: #1e40af; color: white; border: none; border-radius: 25px; cursor: pointer; }
    .chat-window { width: 300px; max-height: 400px; background: #0f172a; border-radius: 15px; display: none; flex-direction: column; }
    .chat-header { padding: 10px; background: #1e3a8a; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
    .chat-body { padding: 10px; overflow-y: auto; flex: 1; }
    .chat-message { margin: 5px 0; display: flex; }
    .chat-message.bot { justify-content: flex-start; }
    .chat-message.user { justify-content: flex-end; }
    .chat-bubble { padding: 8px 10px; border-radius: 10px; max-width: 80%; }
    .chat-bubble.bot { background: #1e3a8a; color: white; }
    .chat-bubble.user { background: #22d3ee; color: #020617; }
    .chat-footer { padding: 10px; display: flex; gap: 5px; }
    .chat-footer input { flex: 1; padding: 5px; border-radius: 10px; border: none; }
    .chat-footer button { padding: 6px 10px; border-radius: 8px; border: none; background: #22d3ee; cursor: pointer; }
  </style>
</head>

<body>
  <!-- Contenu du site ici (si tu veux garder tes sections) -->

  <!-- Chatbot Athy's -->
  <div class="chatbot">
    <button class="chat-button" id="chatToggle">💬 Chaton Athy’s</button>
    <div class="chat-window" id="chatWindow">
      <div class="chat-header">
        Chaton Athy’s 👋
      </div>
      <div class="chat-body" id="chatBody">
        <div class="chat-message bot">
          <div class="chat-bubble bot">
            Bonjour ! Je suis Chaton Athy’s 🤖. Je peux t’aider à comprendre les offres comme : GPT personnel, agent IA, et storytelling. Écris-moi ou parle 🎤 !
          </div>
        </div>
      </div>
      <div class="chat-footer">
        <button id="chatMic">🎤</button>
        <input type="text" id="chatInput" placeholder="Écris ton message..." />
        <button id="chatSend">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    const chatToggle = document.getElementById("chatToggle");
    const chatWindow = document.getElementById("chatWindow");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const chatBody = document.getElementById("chatBody");
    const chatMic = document.getElementById("chatMic");
    let chatHistory = [];

    chatToggle.addEventListener("click", () => {
      chatWindow.style.display = chatWindow.style.display === "none" || !chatWindow.style.display ? "flex" : "none";
    });

    function addMessage(role, content) {
      const wrapper = document.createElement("div");
      wrapper.className = `chat-message ${role}`;
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = content;
      wrapper.appendChild(bubble);
      chatBody.appendChild(wrapper);
      chatBody.scrollTop = chatBody.scrollHeight;
      chatHistory.push({ role, content });
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage("user", text);
      chatInput.value = "";
      try {
        const reply = await sendToManager(chatHistory);
        addMessage("bot", reply);
      } catch (error) {
        addMessage("bot", "Oups, il y a eu un problème. Merci de réessayer !");
      }
    }

    async function sendToManager(messages) {
      const apiKey = "{{OPENAI_API_KEY}}"; // sera remplacé par Vercel
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${apiKey}`,
        },
        body: JSON.stringify({
          model: "gpt-4.1-mini",
          messages: [
            { role: "system", content: "Tu es Chaton Athy’s, assistant amical et professionnel. Réponds sans jamais dire que tu utilises un manager." },
            ...messages,
          ],
        }),
      });
      const data = await response.json();
      return data.choices?.[0]?.message?.content || "Merci pour ton message !";
    }

    chatSend.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    chatMic.addEventListener("click", () => {
      if (!("webkitSpeechRecognition" in window)) {
        alert("La reconnaissance vocale n’est pas disponible.");
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = "fr-FR";
      recognition.onresult = (event) => {
        chatInput.value = event.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    });
  </script>
</body>
</html>
